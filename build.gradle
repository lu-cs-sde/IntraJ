import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
    id 'org.jastadd' version '1.15.0'
}

defaultTasks ':relaxed-stacked:jarCopy'

if (!file('extendj/jastadd_modules').exists()) {
    throw new GradleException('ExtendJ seems to be missing. Please run "git submodule init", then "git submodule update".')
}


ext {
    jastaddDefaultOptions = [ "--rewrite=cnta",
                             "--safeLazy",
                             "--visitCheck=false",
                             "--optimize-imports" ]
    cacheConfigFile = "cache-config.csv"
    intrajMainEntry = 'org.extendj.IntraJ'

    // Provenance: submodules whose revisions we want to track
    submodulePaths = [ extendj : 'extendj',
                       intracfg: 'src/jastadd/CFG/IntraCFG' ]

    // Tracing: Default tracing level if tracing is enabled
    // I.e., this is only used if tracing is enabled with unspecified tracing level
    jastaddTracingDefault = 'all'

    extraOptions = [ ]
    if (project.hasProperty('collapseTrivialSCC')) {
       extraOptions += [ '--collapseTrivialSCC=true' ]
    }
    if (project.hasProperty('evaluator')) {
       extraOptions += [ '--evaluator=' + findProperty('evaluator') ]
    }
    if (project.hasProperty('cacheCycle')) {
       extraOptions += [ '--cacheCycle=' + findProperty('cacheCycle') ]
    }

    // git query command runner, returns empty string on failure
    gitQuery = { File dir, List<String> gitArgs ->
        try {
            def cmd = [ 'git', '-C', dir.absolutePath ] + gitArgs
            def proc = cmd.execute()
            proc.waitForOrKill(5000) // milliseconds
            return proc.exitValue() == 0 ? proc.text.trim() : ''
        } catch (ignored) {
            return ''
        }
    }

    // get git HEAD version, attach "-dirty" if there are uncommitted changes
    gitCommit = { File dir ->
        def head = gitQuery(dir, ['rev-parse', 'HEAD'])
        if (!head) {
            return 'unknown'
        }
        def dirty = gitQuery(dir, ['status', '--porcelain'])
        return dirty ? "${head}-dirty" : head
    }

    // Commit date or "unknown"
    gitCommitDate = { File dir ->
        def d = gitQuery(dir, ['show', '-s', '--format=%cI', 'HEAD'])
        return d ?: 'unknown'
    }

    // The submodule commit present on disk
    submoduleCommit = { File repoRoot, String relPath ->
        def dir = new File(repoRoot, relPath)
        if (new File(dir, '.git').exists()) {
            def c = gitCommit(dir)
            if (c != 'unknown') return c
        }
        return 'missing'
    }


    // Extract identifying information for the JastAdd file
    jastAddJarInfo = { org.gradle.api.artifacts.Configuration conf ->
        def info = [ version: 'unknown', jar: 'unknown', sha256: 'unknown' ]
        try {
            // Find the JastAdd jar that the plugin is using
            def jastaddJar = conf.files.find { f -> // The plugin adds the jar to conf.files
                f.name.endsWith('.jar') && {
                    try {
                        new java.util.zip.ZipFile(f).withCloseable { zf ->
                            zf.getEntry('org/jastadd/JastAdd.class') != null
                        }
                    } catch (ignored) { false }
                }()
            }
            if (jastaddJar == null) {
                return info
            }
            info.jar = jastaddJar.name
            // Don't trust the reported version by itself
            info.sha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(jastaddJar.bytes).encodeHex().toString()
            // Extract JastAdd version directly from the jar:
            new java.util.zip.ZipFile(jastaddJar).withCloseable { zf ->
                def entry = zf.getEntry('Version.properties')
                if (entry != null) {
                    def p = new Properties()
                    zf.getInputStream(entry).withCloseable { p.load(it) }
                    if (p.version) info.version = p.version
                }
            }
        } catch (exn) { }
        return info
    }

    // Write a file `/IntraJBuildInfo.properties` into the project jar that carries
    // provenance information
    writeProvenance = { project, root, boolean tracingEnabled ->
        project.with {
            def provDir  = file("${project.buildDir}/generated-resources/provenance")
            def provFile = file("${provDir}/IntraJBuildInfo.properties")

            def gen = tasks.register('generateBuildProvenance') {
                description 'Generates /IntraJBuildInfo.properties baked into the jar.'
                // Toggling JastAdd options (e.g. --tracing) must change the file.
                inputs.property 'jastaddOptions', jastadd.jastaddOptions.join(' ')
                outputs.file provFile
                // Always re-evaluate so commit/dirty state stays accurate; the
                // file's *content* is what gates downstream rebuilds, and it is
                // stable for a given commit (no wall-clock timestamp), so this
                // does not force needless recompilation.
                outputs.upToDateWhen { false }
                doLast {
                    def info = root.jastAddJarInfo(configurations.jastadd2)
                    provDir.mkdirs()
                    def p = new Properties()
                    p.setProperty('intraj.commit',       root.gitCommit(root.rootDir))
                    p.setProperty('intraj.commit.date',  root.gitCommitDate(root.rootDir))
                    p.setProperty('jastadd.tracing',     Boolean.toString(tracingEnabled))
                    p.setProperty('extendj.commit',      root.submoduleCommit(root.rootDir, root.submodulePaths.extendj))
                    p.setProperty('intracfg.commit',     root.submoduleCommit(root.rootDir, root.submodulePaths.intracfg))
                    p.setProperty('jastadd2.version',    info.version)
                    p.setProperty('jastadd2.jar',        info.jar)
                    p.setProperty('jastadd2.jar.sha256', info.sha256)
                    p.setProperty('jastadd2.options',    jastadd.jastaddOptions.join(' '))
                    p.setProperty('build.variant',       project.name)
                    provFile.withWriter('UTF-8') { w ->
                        p.store(w, 'IntraJ build provenance')
                    }
                }
            }

            sourceSets.main.resources.srcDir provDir
            tasks.named('processResources').configure { dependsOn gen }
        }
    }


    makeJastAddPass = { project, root, jarName, extraOptions = [], indexFromToplevel = false ->
	// indexFromToplevel: for language server [jdtls]:
	//   marks the sub-project whose generated sources we want the language server to
	//   include in this (toplevel) project
        project.with {
            dependencies {
                // override JastAdd plugin defaults with local jastadd2.jar:
                jastadd2 name: "jastadd2"  // ALSO needed in the global dependencies below!
                // In the future, get this from Maven Central:
                //jastadd2 "org.jastadd:jastadd:2.5.0"

                implementation 'junit:junit:4.12'
                implementation files("${rootDir}/tools/magpiebridge-0.1.6-SNAPSHOT-jar-with-dependencies.jar")
                implementation 'com.sun.net.httpserver:http:20070405'
                implementation group: 'org.freemarker', name: 'freemarker', version: '2.3.29'
            }

            def tracingEnabled = extraOptions.any {
                it.startsWith('--tracing') && it != '--tracing=none'
            }

            jastadd {
                configureModuleBuild()
                modules {
                    include(root.file('extendj/jastadd_modules').absolutePath) // Include core ExtendJ modules.

                    module "intraj", {
                        imports "java11 frontend" // ExtendJ dependency for intraj module.

                        jastadd {
                            basedir '../src/jastadd'
                            include "**/*.ast"
                            include "**/*.jadd"
                            include "**/*.jrag"

                            excludeFrom "java4 frontend", "grammar/Java.ast"
                        }

                        // Replace ExtendJ's Java.ast with our patched version that re-adds
                        // NTA children (Finally, Close) needed by IntraJ's CFG modelling.

                    }
                }

                module = 'intraj'

                // Target module to build:
                jastaddOptions = [ "--rewrite=cnta",
                                  "--safeLazy",
                                  "--visitCheck=false",
                                  "--optimize-imports" ] + extraOptions
                astPackage = 'org.extendj.ast'
                parser.name = 'JavaParser'
                scanner.name = 'OriginalScanner'
            }
            sourceSets.main {
                java {
                    srcDir "${rootDir}/extendj/src/frontend-main"
                    // [jdtls] (language server):
                    //   make sure beaver.Symbol and org.jastadd.util are visible
                    srcDir "${rootDir}/extendj/src/frontend"
                    srcDir "${rootDir}/extendj/java8/src/main/java"
                }
                resources {
                    srcDir "${rootDir}/src/java/magpiebridge/resources"
                    srcDir "${rootDir}/extendj/src/res"
                    srcDir jastadd.buildInfoDir
                }
            }
            if (indexFromToplevel) {
                // [jdtls] (language server):
                //   include the generated AST
                sourceSets.main.java.srcDir "${rootDir}/src/java"
                if (tracingEnabled) {
                    sourceSets.main.java.srcDir "${rootDir}/src/tracing"
                }
                //if (!tracingEnabled) {
                    sourceSets.main.java.exclude 'org/extendj/tracing/**'  // path relative to each src root
                    //sourceSets.main.java.exclude "${rootDir}/tracing/**"  // path relative to each src root
                //}
            } else {
                // [jdtls] (language server):
                //   compilation dependency
                tasks.named('compileJava').configure { source "${rootDir}/src/java" }
            }
            afterEvaluate {
                // [jdtls] (language server) must be able to see the generated sources:
                sourceSets.main.java.srcDir jastadd.genDir

                // This should track jastAdd options as a dependency, so that changing
                // options will force a rebuild without manual ./gradlew clean
                tasks.named('generateAst').configure {
                    inputs.property 'jastaddOptions', jastadd.jastaddOptions.join(' ')
                }
            }
            sourceSets.test{
                java{
                    srcDir "${rootDir}/src/test/java/"
                }
            }

            test {
                useJUnit()
                dependsOn 'cleanTest'
                workingDir = rootDir
            }

            jar {
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
                manifest {
                    attributes 'Main-Class': root.intrajMainEntry
                }
                // The line below creates big jars, only necessary if we want to restore the MagpieBridge connection
                // from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
                exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'
                archiveFileName = jarName
                destinationDirectory = file("${rootDir}")
            }

            task jarCopy {
                dependsOn 'jar'
                doLast { println "Built ${rootDir}/${jar.archiveFile.get()}" }
            }

            sourceCompatibility = targetCompatibility = '1.8'

            // Write provenance information
            root.writeProvenance(project, root, tracingEnabled)

            //afterEvaluate {  // To debug which jastadd2.jar we're using
            //    println "jastadd2 conf: ${configurations.jastadd2.files}"
            //}
        }
    }
}

task generateCacheConfig(type: JavaExec) {
    // We don't strictly need to compile, but let's be safe:
    dependsOn ':basic-stacked:compileJava'

    def bsBuildDir        = project(':basic-stacked').buildDir
    def generatedSrcFiles = fileTree("${bsBuildDir}/generated-src")  { include '**/*.java' }
    def srcFiles          = fileTree("src")                          {
        include '**/*.java'
        exclude 'tracing/**' // Don't confuse CAT with the tracing code
    }

    // Explicit dependencies for Gradle
    inputs.files generatedSrcFiles
    inputs.files srcFiles
    outputs.file file(cacheConfigFile)

    // JVM setup
    classpath = files("${rootDir}/tools/cat.jar")

    mainClass = "org.extendj.Cat"

    // Arguments to Cat
    doFirst {
        // Collect generated .java files into stringifiable form:
        def javaGenFiles = generatedSrcFiles.files.collect { it.path }
        def javaFiles = srcFiles.files.collect { it.path }

        // Build CAT's -classpath from the basic-stacked compile dependencies
        def catClasspath = (
            files("${rootDir}/tools/magpiebridge-0.1.6-SNAPSHOT-jar-with-dependencies.jar") +
            project(':basic-stacked').configurations.getByName('compileClasspath') +
            files(project(':basic-stacked').sourceSets.main.output.classesDirs)
        ).asPath

        args = [
            '-classpath', catClasspath,
            '-o', cacheConfigFile,
            '-attributesOnly',
            '-rta',
            '-entryPoint', intrajMainEntry, 'main',
        ] + javaFiles + javaGenFiles
    }
}


repositories {
    mavenLocal()
    flatDir { dirs "tools" }
}

dependencies {
    // override JastAdd plugin defaults with local jastadd2.jar:
    jastadd2 name: "jastadd2"
    //jastadd2 files("${rootProject.projectDir}/tools/jastadd2.jar")
    // In the future, get this from Maven Central:
    //jastadd2 "org.jastadd:jastadd:2.5.0"
}


subprojects {
    repositories {
        mavenLocal()
        flatDir { dirs "${rootProject.projectDir}/tools" }
    }
}

clean.dependsOn ':basic-stacked:clean', ':relaxed-stacked:clean'

// We build the jar indirectly, via ':relaxed-stacked:jarCopy', so no local activities needed:
tasks.named('jar') {
    enabled = false
}

sourceSets.test.java.srcDirs = [] // Don't run tests without the JastAdd apparatus...
test {
    dependsOn ':relaxed-stacked:test' // ...delegate to relaxed-stacked instead
    enabled = false
    testLogging {
        outputs.upToDateWhen {false}
        // show stderr during tracing
        showStandardStreams = true
    }
}


// //jar.destinationDirectory = projectDir
// //
// // // Java -source and -target version.
sourceCompatibility = targetCompatibility = '11'

task sourceZip(type: Zip) {
    description 'Builds a Zip file with the entire repisotory (including the ExtendJ submodule).'
    destinationDirectory = projectDir
    archiveFileName = "intraj-src.zip"

    from (projectDir) {
        exclude '**/.git'
        exclude '**/.gitignore'
        exclude '**/.gitattributes'
        exclude '**/.gitmodules'
        exclude 'build'
        exclude 'bin'
        exclude '.gradle'
        exclude '.classpath'
        exclude '.settings'
        exclude '.project'
        exclude '*.jar'
        exclude '*.zip'
        exclude '**/*.swp'
    }

    into 'intraj'
}
